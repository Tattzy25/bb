# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6316db401475e9e105d5134c1668b3ab"
name = "time"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_cart_transforms,read_analytics,read_analytics_annotations,read_app_proxy,read_cart_transforms,read_channels,read_checkout_and_accounts_configurations,read_checkout_branding_settings,read_checkout_kit_enhanced_buyer_events,read_checkouts,read_companies,read_content,read_custom_fulfillment_services,read_custom_pixels,read_customer_data_erasure,read_customer_events,read_customer_merge,read_customers,read_delivery_option_generators,read_discounts,read_discounts_allocator_functions,read_discovery,read_draft_orders,read_files,read_fulfillment_constraint_rules,read_fulfillments,read_gift_card_transactions,read_gift_cards,read_inventory,read_inventory_shipments,read_inventory_shipments_received_items,read_inventory_transfers,read_legal_policies,read_locales,read_locations,read_marketing_integrated_campaigns,read_markets,read_markets_home,read_merchant_managed_fulfillment_orders,read_metaobject_definitions,read_metaobjects,read_online_store_navigation,read_online_store_pages,read_order_edits,read_orders,read_packing_slip_templates,read_payment_customizations,read_payment_terms,read_pixels,read_price_rules,read_privacy_settings,read_product_feeds,read_product_listings,read_products,read_publications,read_purchase_options,read_reports,read_resource_feedbacks,read_returns,read_shipping,read_shopify_payments_disputes,read_themes,read_third_party_fulfillment_orders,read_translations,read_validations,write_app_proxy,write_cart_transforms,write_checkouts,write_companies,write_custom_fulfillment_services,write_custom_pixels,write_customer_merge,write_delivery_customizations,write_discounts,write_discounts_allocator_functions,write_discovery,write_draft_orders,write_files,write_fulfillment_constraint_rules,write_fulfillments,write_gift_card_transactions,write_gift_cards,write_inventory_shipments,write_online_store_pages,write_order_edits,write_orders,write_packing_slip_templates,write_payment_customizations,write_price_rules,write_products,write_reports,write_resource_feedbacks,write_returns,write_shopify_payments_disputes,write_validations"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
